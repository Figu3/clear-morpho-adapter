[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 10000
ignored_error_codes = ["transient-storage"]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "vault-v2/=lib/morpho-vault-v2/src/",
]

[fuzz]
runs = 64

[invariant]
runs = 32
depth = 40
fail_on_revert = false

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
